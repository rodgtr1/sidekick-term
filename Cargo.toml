[package]
name = "sidekick-term"
version = "0.1.0"
edition = "2021"
default-run = "sidekick"
license = "MIT"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
vte4 = { version = "0.10", features = ["v0_78"] }
glib = "0.22"
gio = "0.22"
pango = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
libc = "0.2"
similar = "2"
indexmap = "2"
sourceview5 = "0.11"
toml = "0.8"
webkit6 = { version = "0.6", features = ["v2_42"] }

[[bin]]
name = "sidekick"
path = "src/main.rs"

[[bin]]
name = "sidekick-ctl"
path = "src/bin/sidekick-ctl.rs"

[[bin]]
name = "sidekick-hook"
path = "src/bin/sidekick-hook.rs"

[[bin]]
name = "sidekick-agent-status"
path = "src/bin/sidekick-agent-status.rs"
